version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_nexus_backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ai-nexus-rag-engine-secret-key-change-in-production}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-tencent/hy3:free}
      - VISION_LLM_MODEL=${VISION_LLM_MODEL:-nvidia/nemotron-nano-12b-v2-vl:free}
      - SUMMARY_MODEL=${SUMMARY_MODEL:-nvidia/nemotron-nano-9b-v2:free}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_nexus_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
